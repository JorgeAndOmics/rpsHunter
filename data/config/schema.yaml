blast: include('blast_schema')
rpsblast: include('rpsblast_schema')
orf: include('orf_schema')
hmmer: include('hmmer_schema')
programs: include('programs_schema', required=False)
query: include('query_schema', required=False)
queries: map(str(), key=str(), required=False)
execution: include('execution_schema')
display: include('display_schema')
root: include('root_schema')
logging: include('logging_schema')
hit_domain_inventory: include('hit_domain_inventory_schema', required=False)
species: include('species_schema')
---
blast_schema:
  e_value: num(min=0)
  perc_identity: num(min=0, max=100)
  seq_length: int(min=1)
  bitscore: num(min=0)

rpsblast_schema:
  e_value: num(min=0)
  comp_based_stats: int(min=0, max=4)
  seg: str(matches='^(yes|no)$')
  window_size: int(min=0, required=False)
  target_domains: list(str(), required=False)

orf_schema:
  enabled: bool()
  min_orf_length: int(min=1)
  start_codon: str(matches='^([ATGC]{3})?$')
  longest_orf: bool()

hmmer_schema:
  enabled: bool()
  profiles: list(str(), required=False)
  use_gathering_threshold: bool()
  evalue: num(min=0, required=False)
  dom_evalue: num(min=0, required=False)
  min_score: any(num(min=0), null(), required=False)
  min_coverage: num(min=0, max=1)
  min_alignment_length: int(min=0)
  max_sensitivity: bool()
  bias_filter: bool()
  seed: int(min=0)

query_schema:
  format: str()
  accession: str(matches='[A-Z]{2,}_?[0-9]+\\.[0-9]{1,2}')

execution_schema:
  num_cores: int(min=1)
  use_species_list: bool()
  random_id_length: int(min=1)
  retrieval_time_lag: num(min=0)
  max_retrieval_attempts: int(min=1)
  entrez_email: str()

display_schema:
  display_snakemake_info: bool()
  display_requests_warning: bool()
  display_operation_info: bool()

root_schema:
  db_root_folder: str()
  data_root_folder: str()
  results_root_folder: str()
  logs_root_folder: str()

logging_schema:
  level_styles: include('level_styles_schema')
  field_styles: include('field_styles_schema')

level_styles_schema:
  debug: include('color_only_schema')
  info: include('color_bold_schema')
  warning: include('color_only_schema')
  error: include('color_bold_schema')
  critical: include('color_bold_bg_schema')

field_styles_schema:
  asctime: include('color_only_schema')
  levelname: include('color_only_schema')
  name: include('color_only_schema')

color_only_schema:
  color: str()

color_bold_schema:
  color: str()
  bold: str(matches='^(yes|no)$')

color_bold_bg_schema:
  color: str()
  bold: str(matches='^(yes|no)$')
  background: str()

hit_domain_inventory_schema:
  locus_gap: int(min=0, required=False)

species_schema: map(str(), key=str())

programs_schema:
  tblastn: str(required=False)
  rpsblast: str(required=False)
  blast_formatter: str(required=False)
  makeblastdb: str(required=False)
  rpsbproc: str(required=False)
  makeprofiledb: str(required=False)
