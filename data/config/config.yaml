blast:
  e_value: 10          # Very relaxed
  perc_identity: 20    # Very relaxed
  seq_length: 15       # Very relaxed
  bitscore: 20         # Very relaxed

rpsblast:
  e_value: 1000        # Raised to capture mouse SSXRD (rpsbproc re-scores raw hits)
  comp_based_stats: 0  # Disable composition-based statistics (more sensitive)
  seg: 'no'            # Disable low-complexity filtering
  window_size: 0       # 1-hit algorithm (default: 40) - more sensitive
  target_domains: ['KRAB', 'SET', 'SSXRD', 'zf-C2H2', 'COG5048', 'zf-H2C2', 'ZnF_C2H2']

orf:
  enabled: false           # Toggle ORF analysis on/off (DISABLED to capture KRAB/SET/SSXRD)
  min_orf_length: 50       # Minimum ORF length in nucleotides
  start_codon: ''          # Start codon filter (empty string = no filter)
  longest_orf: true        # If true, keep only longest ORF per reading frame

hmmer:
  enabled: true            # Toggle HMMER on/off

  # Profile selection
  profiles: ['KRAB', 'SET', 'SSXRD', 'zf-C2H2']

  # Threshold strategy
  use_gathering_threshold: false  # Use Pfam's curated --cut_ga

  # Manual thresholds (ignored if use_gathering_threshold: true)
  evalue: 10               # Very relaxed
  dom_evalue: 10           # Very relaxed
  min_score: null          # null = disabled

  # Quality filters
  min_coverage: 0.1        # Very relaxed
  min_alignment_length: 10 # Very relaxed

  # Sensitivity
  max_sensitivity: false   # --max flag (slow)
  bias_filter: true

  # Reproducibility
  seed: 67

# Optional: Override BLAST+ program names (defaults match bioconda package)
# Uncomment and modify if your system uses different naming (e.g., rpsblast+)
#programs:
#  tblastn: 'tblastn'
#  rpsblast: 'rpsblast'
#  blast_formatter: 'blast_formatter'
#  makeblastdb: 'makeblastdb'
#  rpsbproc: 'rpsbproc'

queries:
  'NP_659058.3': 'Mouse PRDM9'
  'NP_064612.2': 'Human PRDM9'

execution:
  num_cores: 16
  use_species_list: true
  random_id_length: 6
  retrieval_time_lag: 0.3
  max_retrieval_attempts: 9
  entrez_email: 'your_email@example.com'

display:
  display_snakemake_info: true
  display_requests_warning: false
  display_operation_info: false

root:
  db_root_folder: '/mnt/v/databases/bat-experimental'
  data_root_folder: '/mnt/c/Users/Lympha/Documents/Repositories/rpsHunter/data'
  results_root_folder: '/mnt/c/Users/Lympha/Documents/Repositories/rpsHunter/results'
  logs_root_folder: '/mnt/c/Users/Lympha/Documents/Repositories/rpsHunter/logs'

logging:
  level_styles:
    debug: { color: 'white' }
    info: { color: 'cyan', bold: 'yes' }
    warning: { color: 'yellow' }
    error: { color: 'red', bold: 'yes' }
    critical: { color: 'black', bold: 'yes', background: 'red' }
  field_styles:
    asctime: { color: 'green' }
    levelname: { color: 'green' }
    name: { color: 'green' }

species:
  'Desmodus_rotundus': 'Desmodus rotundus'
  'Antrozous_pallidus': 'Antrozous pallidus'
  'Molossus_molossus': 'Molossus molossus'
  'Homo_sapiens': 'Homo sapiens'
  'Mus_musculus': 'Mus musculus'
