# rpsHunter tooling config. Not a Python package manifest: this repository is a
# Snakemake workflow, not a library. Ruff, mypy, pytest, coverage and import
# checks are configured here. Runtime dependencies live in
# data/config/environment.yaml.
#
# LEGACY LIST: empty for Python since 2026-11-27. Scripts that predated the quality
# gate were left out of ruff, mypy and coverage as whole files until rewritten
# (docs/adr/ADR-002). Every Python file is now under the gate; the list may not
# grow again (tests/unit/test_legacy_list.py). The shell list in the Makefile is
# empty too.

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["workflow/scripts", "tests"]
extend-exclude = [
    ".snakemake",
    "results",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "PTH",    # flake8-use-pathlib
    "RUF",    # Ruff-specific
    "A",      # flake8-builtins
    "DTZ",    # flake8-datetimez
    "LOG",    # flake8-logging
    "PT",     # flake8-pytest-style
    "RSE",    # flake8-raise
    "RET",    # flake8-return
    "ARG",    # flake8-unused-arguments
    "PL",     # Pylint
    "PERF",   # Perflint
    "D",      # pydocstyle, Google convention (below)
]
ignore = [
    "E501",    # line length is the formatter's job
    "PLR0913", # too many arguments: script entry points mirror their CLI
    "PLR0917", # too many positional arguments: PLR0913's sibling
    "PLR2004", # magic values in comparisons
    "D105",    # dunder methods: their behaviour is the protocol's, documented by Python
    "D107",    # __init__: Google style documents construction in the class docstring
]

[tool.ruff.lint.per-file-ignores]
# Test names state the behaviour under test, so tests need no docstrings; the
# docstring FORMAT rules still apply to the ones they have.
"tests/**/*.py" = ["ARG", "PLR2004", "D100", "D101", "D102", "D103", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unreachable = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_reexport = true
files = ["workflow/scripts"]
exclude = [
    '(^|/)tests/',
]
enable_error_code = [
    "ignore-without-code",
    "redundant-cast",
    "truthy-bool",
]

# Third-party libraries without type stubs. Keep this list narrow.
[[tool.mypy.overrides]]
module = ["pyarrow.*", "yamale.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["workflow/scripts"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "-q",
]
markers = [
    "integration: runs external tools (blast, hmmer, rpsbproc, snakemake)",
]

[tool.coverage.run]
source = ["workflow/scripts"]
branch = true
omit = []

[tool.coverage.report]
# The floor only rises. 100% was measured when tags.py, the first rewritten
# module, landed (2026-11-26); 95 leaves room for an unreachable defensive branch
# without inviting untested code.
fail_under = 95
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
