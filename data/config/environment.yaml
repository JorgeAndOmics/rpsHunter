# rpsHunter conda environment: what the pipeline needs, and why each part is here.
# The exact builds that were tested are in environment.lock-linux-64.txt, which is
# what `make env` installs. Changing a version under "analysis" can change results:
# record it in an ADR (docs/adr/) and regenerate the lock.
name: rpsHunter
channels:
  - conda-forge
  - bioconda
dependencies:
  # --- workflow engine and language runtimes ---
  - python=3.12.16
  - r-base=4.4.3
  - snakemake-minimal=9.27.2
  # --- analysis: search tools (versions affect results) ---
  - blast=2.17.0
  - hmmer=3.4
  - rpsbproc=0.5.1
  # --- analysis: Python libraries ---
  - numpy=2.5.5
  - pandas=2.2.2
  - pyarrow=17.0.0
  # --- figures (R; draws the tables, changes no result) ---
  - font-ttf-ibm-plex-sans=1.1.0   # the one typeface of every figure, embedded in the PDFs
  - r-arrow=17.0.0
  - r-dplyr=1.2.1
  - r-ggplot2=4.0.4
  - r-scales=1.4.0
  # --- data acquisition (download stages only) ---
  - entrez-direct=26.0
  - jq=1.8.2
  - ncbi-datasets-cli=18.41.1
  - unzip=6.0
  - wget=1.25.0
  # --- configuration, command line and logging ---
  - pyyaml=6.0.3
  - r-argparse=2.3.3
  - r-yaml=2.3.12
  - yamale=6.1.0
  # --- development tooling (make check); never affects results ---
  - deptry=0.25.1
  - mypy=2.4.1
  - pandas-stubs=3.1.0.261029
  - pre-commit=4.7.0
  - pytest=9.2.0
  - pytest-cov=7.1.0
  - pytest-mock=3.17.0
  - r-colorspace=2.1_3     # colour-blindness simulation in the palette tests
  - r-cyclocomp=1.1.2
  - r-farver=2.1.2         # colour distances in the palette tests
  - r-lintr=3.4.0
  - r-testthat=3.3.2
  - ruff=0.17.6
  - types-pyyaml=6.0.12.20261122
